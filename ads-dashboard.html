let subsOpen = false;
function toggleSubsPanel() {
  subsOpen = !subsOpen;
  const body = document.getElementById('subs-panel-body');
  const chev = document.getElementById('subs-panel-chevron');
  if (body) body.style.display = subsOpen ? 'block' : 'none';
  if (chev) chev.textContent = subsOpen ? '▲ Hide' : '▼ Show';
}

function renderSubsList(items) {
  const el = document.getElementById('subs-list');
  if (!el) return;
  if (!items || !items.length) { el.innerHTML = '<div style="font-size:12px;color:var(--gray-500);padding:8px 0;">No subscriptions yet.</div>'; return; }
  el.innerHTML = items.map(s => `
    <div class="sub-row" id="sub-row-${s.id}">
      <div class="sub-name-wrap">
        <div class="sub-name">${escHtml(s.name)}</div>
        <div class="sub-cat">${CAT_LABELS[s.category] || s.category}</div>
      </div>
      <input class="sub-amount-input" type="number" min="0" step="0.01" value="${s.amount}"
        onchange="updateSubAmount('${s.id}', this.value)" style="border:1px solid var(--gray-300);">
      <span class="sub-toggle ${s.active ? '' : 'off'}" title="${s.active ? 'Active — click to pause' : 'Paused — click to activate'}"
        onclick="toggleSub('${s.id}', ${!s.active})">${s.active ? '✅' : '⏸'}</span>
      <button onclick="deleteSub('${s.id}')" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:13px;font-weight:700;">✕</button>
    </div>`).join('');
}

function openAddSubForm() {
  const f = document.getElementById('add-sub-form');
  if (f) f.style.display = 'block';
}

async function saveNewSub() {
  const name   = document.getElementById('new-sub-name')?.value?.trim();
  const cat    = document.getElementById('new-sub-cat')?.value;
  const amount = parseFloat(document.getElementById('new-sub-amount')?.value) || 0;
  if (!name || !cat) return alert('Name and category required');
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + Date.now();
  await fetch('/api/subscriptions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, name, category: cat, amount, active: true }),
  });
  pnlData = null; loadPnl(); // full reload to recalc totals
}

async function updateSubAmount(id, amount) {
  if (!pnlData) return;
  const sub = (pnlData.expenses?.subscriptions?.items || []).find(s => s.id === id);
  if (!sub) return;
  await fetch('/api/subscriptions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...sub, amount: parseFloat(amount) || 0 }),
  });
  pnlData = null; loadPnl();
}

async function toggleSub(id, newActive) {
  if (!pnlData) return;
  const sub = (pnlData.expenses?.subscriptions?.items || []).find(s => s.id === id);
  if (!sub) return;
  await fetch('/api/subscriptions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...sub, active: newActive }),
  });
  pnlData = null; loadPnl();
}

async function deleteSub(id) {
  if (!confirm('Remove this subscription?')) return;
  await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
  pnlData = null; loadPnl();
}

async function saveShippingAvg(val) {
  await fetch('/api/subscriptions/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ avgLabelCost: parseFloat(val) || 6.00 }),
  });
  pnlData = null; loadPnl();
}

// Debounced auto-save for manual expense inputs
let savedNotes = '';
let expSaveTimer = null;
function scheduleExpenseSave() {
  clearTimeout(expSaveTimer);
  const statusEl = document.getElementById('expSaveStatus');
  if (statusEl) statusEl.textContent = 'Saving…';
  expSaveTimer = setTimeout(async () => {
    const payload = {};
    document.querySelectorAll('.expense-input').forEach(inp => {
      payload[inp.dataset.key] = parseFloat(inp.value) || 0;
    });
    payload.notes = savedNotes;
    try {
      const res = await fetch('/api/pnl/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if ((await res.json()).success) {
        if (statusEl) { statusEl.textContent = 'Saved ✓'; setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2000); }
        recalcPnl(payload);
      }
    } catch { if (statusEl) statusEl.textContent = 'Save failed'; }
  }, 600);
}

// Live-update the P&L summary without a full reload (manual inputs only — this_month only)
function recalcPnl(manualExpenses) {
  if (!pnlData || pnlPeriod !== 'this_month') return;
  // Temporarily patch manual into pnlData for getPeriodData
  const saved = pnlData.expenses.manual;
  pnlData.expenses.manual = { ...saved, ...manualExpenses };
  const pd = getPeriodData(pnlData, 'this_month');
  pnlData.expenses.manual = saved;

  const expEl  = document.getElementById('pnl-total-exp');
  const netEl  = document.getElementById('pnl-net-profit');
  const netEl2 = document.getElementById('pnl-net-profit-2');
  const brnEl  = document.getElementById('pnl-burn-rate');
  const mrgEl  = document.getElementById('pnl-margin');

  if (expEl)  expEl.innerHTML = `<strong>${f$(pd.totalExp)}</strong>`;
  const netCls = 'm-value ' + (pd.netProfit >= 0 ? 'green' : 'red');
  if (netEl)  { netEl.textContent  = f$(pd.netProfit); netEl.className  = netCls; }
  if (netEl2) { netEl2.textContent = f$(pd.netProfit); netEl2.className = netCls; }
  if (brnEl)  brnEl.innerHTML = f$(pd.burnRate) + '<span style="font-size:13px;font-weight:400;color:var(--gray-500);">/day</span>';
  const mrgCls = 'm-value ' + (pd.margin == null ? '' : pd.margin >= 20 ? 'green' : pd.margin >= 0 ? 'yellow' : 'red');
  if (mrgEl)  { mrgEl.textContent = pd.margin != null ? pd.margin.toFixed(1) + '%' : '—'; mrgEl.className = mrgCls; }
}

// ── AI Recommendations ────────────────────────────────────────────────────────
async function loadRecommendations() {
  const container = document.getElementById('ai-insights-content');
  const btn       = document.getElementById('aiRefreshBtn');
  if (!container) return;
  if (btn) btn.disabled = true;
  container.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div> Analyzing your live data and searching DTC benchmarks…</div>';
  try {
    const res  = await fetch('/api/recommendations');
    const json = await res.json();
    if (!json.success) {
      if (json.notConfigured) {
        container.innerHTML = `<div class="ai-error">
          <strong>Anthropic API key not configured.</strong><br>
          Add <code>ANTHROPIC_API_KEY=your_key</code> to your <code>.env</code> file and restart the server.<br>
          <a href="https://console.anthropic.com/" target="_blank" style="color:#5a00c8;">Get an API key →</a>
        </div>`;
      } else {
        container.innerHTML = `<div class="ai-error">Failed to generate insights: ${json.error || 'Unknown error'}. <button class="ai-refresh-btn" onclick="refreshRecommendations()">Try again</button></div>`;
      }
      return;
    }
    recommendationsData = json;
    renderRecommendations(json);
  } catch (err) {
    if (container) container.innerHTML = `<div class="ai-error">Network error: ${err.message}. <button class="ai-refresh-btn" onclick="refreshRecommendations()">Try again</button></div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}

function refreshRecommendations() {
  recommendationsData = null;
  loadRecommendations();
}

const FOCUS_LABELS = { revenue: 'Revenue', ads: 'Meta Ads', email: 'Email', content: 'Content', expenses: 'Expenses', product: 'Product' };

function renderRecommendations(data) {
  const container = document.getElementById('ai-insights-content');
  if (!container) return;
  const recs = data.recommendations || [];
  if (!recs.length) { container.innerHTML = '<div class="ai-error">No recommendations returned. Try refreshing.</div>'; return; }

  const ts = data.generatedAt ? ' · Generated ' + new Date(data.generatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const noLive = !data.hasLiveData ? '<div style="font-size:11px;color:var(--gray-500);margin-bottom:12px;">⚠ Shopify not connected — recommendations based on Meta + Email data only.</div>' : '';

  const cards = recs.map((r, i) => {
    const focusKey = (r.focusArea || '').toLowerCase();
    const impactKey = (r.impact || 'medium').toLowerCase();
    const focusLabel = FOCUS_LABELS[focusKey] || r.focusArea || '';
    const impactLabel = { high: '⬆ High Impact', medium: 'Mid Impact', low: 'Low Impact' }[impactKey] || r.impact;

    return `<div class="rec-card">
      <div class="rec-card-header">
        ${focusLabel ? `<span class="rec-focus-badge rec-focus-${focusKey}">${focusLabel}</span>` : ''}
        <span class="rec-impact-badge rec-impact-${impactKey}">${impactLabel}</span>
      </div>
      <div class="rec-action">${i + 1}. ${r.action || ''}</div>
      <div class="rec-why">${r.why || ''}</div>
      ${r.mathNote ? `<div class="rec-math">📐 ${r.mathNote}</div>` : ''}
      ${r.book ? `<div class="rec-book">📖 <strong>${r.book}</strong>${r.bookAuthor ? ' — ' + r.bookAuthor : ''}</div>` : ''}
    </div>`;
  }).join('');

  container.innerHTML = `<div style="font-size:11px;color:var(--gray-500);margin-bottom:14px;">Based on your live data + web research${ts}</div>${noLive}<div class="rec-grid">${cards}</div>`;
}

// ── Inventory tab ─────────────────────────────────────────────────────────────
async function loadInventory() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '↻ Loading…';
  showLoading();
  try {
    const res  = await fetch('/api/inventory');
    const json = await res.json();
    if (!json.success) {
      if (json.notConnected) {
        document.getElementById('main').innerHTML = `
          <div class="state-card">
            <div class="state-icon">📦</div>
            <div class="state-title">Shopify Not Connected</div>
            <div class="state-desc">
              The Inventory tab requires Shopify with <strong>read_products</strong> and <strong>read_inventory</strong> scopes.<br><br>
              <a href="/shopify/auth" target="_blank" onclick="pollForShopifyConnect()" style="background:#0a0a0a;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:6px;">Connect Shopify (with new scopes) →</a>
            </div>
          </div>`;
      } else if (json.scopeError) {
        document.getElementById('main').innerHTML = `
          <div class="state-card">
            <div class="state-icon">🔒</div>
            <div class="state-title">Missing Shopify Permissions</div>
            <div class="state-desc">
              Your current Shopify token doesn't have <strong>read_products</strong> or <strong>read_inventory</strong> scope.<br><br>
              Re-authorize to grant the new permissions:<br><br>
              <a href="/shopify/auth" target="_blank" onclick="pollForShopifyConnect()" style="background:#0a0a0a;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:6px;">Re-authorize Shopify →</a>
            </div>
          </div>`;
      } else {
        showError(json.error || 'Unknown error loading inventory');
      }
      return;
    }
    inventoryData = json;
    renderInventory(json);
    document.getElementById('timestamp').textContent =
      'Updated ' + new Date(json.fetchedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false; btn.textContent = '↻ Refresh';
  }
}

function renderInventory(data) {
  const { products, summary, adSpend, goalAlignment, recommendations } = data;
  const s = summary;

  // Summary cards
  const summaryHtml = `
    <div class="inv-summary-grid">
      <div class="metric-card">
        <div class="m-label">Tracked SKUs <span class="m-source src-shopify">Shopify</span></div>
        <div class="m-value">${s.trackedCount}</div>
        <div class="m-sub">Inventory-managed variants</div>
      </div>
      <div class="metric-card" style="border-top:2px solid var(--red);">
        <div class="m-label">Critical</div>
        <div class="m-value ${s.criticalCount > 0 ? 'red' : ''}">${s.criticalCount}</div>
        <div class="m-sub">Under 10 units or out of stock</div>
      </div>
      <div class="metric-card" style="border-top:2px solid #b35a00;">
        <div class="m-label">Reorder Needed</div>
        <div class="m-value ${s.reorderCount > 0 ? 'yellow' : ''}">${s.reorderCount}</div>
        <div class="m-sub">Days left ≤ lead time</div>
      </div>
      <div class="metric-card">
        <div class="m-label">Inventory Value <span class="m-source src-shopify">Shopify</span></div>
        <div class="m-value">${f$(s.totalInventoryValue)}</div>
        <div class="m-sub">${fN(s.totalInventory)} total tracked units</div>
      </div>
    </div>`;

  // Ad spend impact section
  let adSpendHtml = '';
  if (adSpend && adSpend.changePercent != null) {
    const chg   = adSpend.changePercent;
    const chgCls = chg > 0 ? 'delta-up' : chg < 0 ? 'delta-down' : 'delta-neutral';
    const arrow  = chg > 0 ? '▲' : chg < 0 ? '▼' : '';
    adSpendHtml = `
      <div class="inv-section">
        <div class="section-title">Ad Spend Impact on Inventory</div>
        <div style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);">
          <div style="display:flex;gap:32px;flex-wrap:wrap;align-items:center;">
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">This Week</div>
              <div style="font-size:20px;font-weight:700;">${adSpend.currWeek != null ? f$(adSpend.currWeek) : '—'}</div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Last Week</div>
              <div style="font-size:20px;font-weight:700;">${adSpend.prevWeek != null ? f$(adSpend.prevWeek) : '—'}</div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Change</div>
              <div style="font-size:20px;font-weight:700;" class="${chgCls}">${arrow} ${Math.abs(chg)}%</div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Velocity Multiplier</div>
              <div style="font-size:20px;font-weight:700;">${adSpend.multiplier.toFixed(2)}×</div>
            </div>
            ${s.adRiskCount > 0 ? `<div style="background:#fce8f3;border-radius:8px;padding:10px 14px;flex-shrink:0;"><span style="font-size:12px;font-weight:700;color:#a01060;">⚠ ${s.adRiskCount} variant${s.adRiskCount > 1 ? 's' : ''} at ad spend risk — see table below</span></div>` : ''}
          </div>
        </div>
      </div>`;
  }

  // Goal alignment section
  const ga = goalAlignment;
  let goalHtml = '';
  if (ga) {
    const gapUnits  = ga.unitsNeeded != null ? ga.unitsNeeded - ga.totalInventory : null;
    const goalColor = ga.canHitGoal === false ? 'var(--red)' : 'var(--green)';
    goalHtml = `
      <div class="inv-section">
        <div class="section-title">$100k Goal Alignment</div>
        <div style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);">
          <div style="display:flex;gap:32px;flex-wrap:wrap;align-items:center;">
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Revenue Still Needed</div>
              <div style="font-size:20px;font-weight:700;">${f$(ga.remaining)}</div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Units Needed</div>
              <div style="font-size:20px;font-weight:700;">${ga.unitsNeeded != null ? fN(ga.unitsNeeded) : '—'}</div>
              <div style="font-size:11px;color:var(--gray-500);">at ${f$(ga.avgItemPrice)} avg AOV</div>
            </div>
            <div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Current Inventory</div>
              <div style="font-size:20px;font-weight:700;">${fN(ga.totalInventory)}</div>
            </div>
            ${gapUnits != null ? `<div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:4px;">Gap</div>
              <div style="font-size:20px;font-weight:700;color:${goalColor};">${ga.canHitGoal ? '✓ On track' : fN(gapUnits) + ' units short'}</div>
            </div>` : ''}
          </div>
        </div>
      </div>`;
  }

  // Filter bar
  const filterHtml = `
    <div class="inv-filter-bar">
      <button class="inv-filter-btn active" onclick="filterInventoryTable('all', this)">All</button>
      <button class="inv-filter-btn f-critical" onclick="filterInventoryTable('critical', this)">Critical ${s.criticalCount > 0 ? '(' + s.criticalCount + ')' : ''}</button>
      <button class="inv-filter-btn f-reorder" onclick="filterInventoryTable('reorder', this)">Reorder ${s.reorderCount > 0 ? '(' + s.reorderCount + ')' : ''}</button>
      <button class="inv-filter-btn f-warn" onclick="filterInventoryTable('warn', this)">Running Low ${s.warnCount > 0 ? '(' + s.warnCount + ')' : ''}</button>
      <button class="inv-filter-btn" onclick="filterInventoryTable('ok', this)">OK</button>
    </div>`;

  // Product groups
  const productGroupsHtml = products.map(product => {
    const rows = product.variants.map(v => {
      const daysNum  = v.daysRemaining != null ? v.daysRemaining.toFixed(1) : null;
      const projNum  = v.projDaysRemaining != null ? v.projDaysRemaining.toFixed(1) : null;
      const daysCls  = v.daysRemaining != null
        ? (v.daysRemaining <= v.leadTimeDays ? 'inv-days-crit' : v.daysRemaining <= 30 ? 'inv-days-warn' : 'inv-days-ok')
        : '';
      const rowClass = v.status === 'stockout' ? 'row-stockout' : v.status === 'critical' ? 'row-critical' : v.status === 'reorder' ? 'row-reorder' : '';
      const badgeClass = { ok: 's-ok', warn: 's-warn', reorder: 's-reorder', critical: 's-critical', stockout: 's-stockout' }[v.status] || 's-ok';
      const badgeLabel = { ok: 'OK', warn: 'Low', reorder: 'Reorder', critical: 'Critical', stockout: 'Stockout' }[v.status] || v.status;

      return `<tr class="${rowClass}" data-status="${v.status}"
          data-inventory="${v.inventory != null ? v.inventory : ''}"
          data-daily-vel="${v.dailyVelocity}"
          data-proj-daily-vel="${v.projDailyVel}"
          data-lead-time="${v.leadTimeDays}">
        <td style="font-weight:600;color:var(--black);">${escHtml(v.title)}${v.adSpendRisk ? '<span class="inv-risk-badge">Ad Risk</span>' : ''}</td>
        <td style="color:var(--gray-500);font-size:11px;">${escHtml(v.sku || '—')}</td>
        <td>${v.tracked ? `<span class="inv-days-num">${fN(v.inventory)}</span>` : '<span class="no-velocity">untracked</span>'}</td>
        <td>${v.unitsSold > 0 ? fN(v.unitsSold) : '<span class="no-velocity">0</span>'}</td>
        <td>${v.dailyVelocity > 0 ? v.dailyVelocity.toFixed(2) : '<span class="no-velocity">—</span>'}</td>
        <td>${daysNum != null ? `<span class="inv-days-num ${daysCls}">${daysNum}d</span>` : '<span class="no-velocity">—</span>'}</td>
        <td>${projNum != null ? `<span class="inv-days-num">${projNum}d</span>` : '<span class="no-velocity">—</span>'}</td>
        <td><input class="lt-input" type="number" min="1" step="1" value="${v.leadTimeDays}"
          data-variant-id="${v.id}" data-field="leadTimeDays"
          oninput="scheduleLeadTimeSave(this)"></td>
        <td><input class="lt-input" type="number" min="0" step="1" value="${v.reorderQty}"
          data-variant-id="${v.id}" data-field="reorderQty"
          oninput="scheduleLeadTimeSave(this)"></td>
        <td><span class="inv-status-badge ${badgeClass}">${badgeLabel}</span></td>
      </tr>`;
    }).join('');

    return `<div class="inv-product-group">
      <div class="inv-product-header">${escHtml(product.title)}</div>
      <div style="overflow-x:auto;">
        <table class="inv-table">
          <thead><tr>
            <th>Variant</th>
            <th>SKU</th>
            <th>Stock</th>
            <th>Sold (28d)</th>
            <th>Daily</th>
            <th>Days Left</th>
            <th>Proj. Days*</th>
            <th>Lead Time (days)</th>
            <th>Reorder Qty</th>
            <th>Status</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  // Recommendations
  const recsHtml = recommendations.length > 0
    ? `<div class="inv-section">
        <div class="section-title">Recommendations</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${recommendations.map(r => `
            <div class="inv-rec-card">
              <div><span class="inv-rec-urgency u-${r.urgency}">${r.urgency}</span></div>
              <div class="inv-rec-msg">${r.message}</div>
              ${r.principle ? `<div class="inv-rec-book">Based on <em>${r.principle}</em> — ${r.author}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>`
    : '';

  document.getElementById('main').innerHTML = `
    <div style="max-width:1120px;margin:0 auto;padding:24px 16px 60px;">
      <div class="inv-section">
        <div class="section-title">Inventory Overview <span class="m-source src-shopify" style="font-size:10px;padding:2px 7px;border-radius:4px;vertical-align:middle;">Shopify</span></div>
        ${summaryHtml}
      </div>
      ${adSpendHtml}
      ${goalHtml}
      ${recsHtml}
      <div class="inv-section">
        <div class="section-title">Products &amp; Variants</div>
        ${filterHtml}
        <div id="inv-product-list">
          ${products.length > 0 ? productGroupsHtml : '<div class="state-card"><div class="state-title">No active products found</div></div>'}
        </div>
        <div style="font-size:11px;color:var(--gray-500);margin-top:8px;">* projected at current ad spend trajectory</div>
      </div>
    </div>`;
}

// Escape HTML helper for inventory render
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Debounced lead-time save
const _ltTimers = {};
function scheduleLeadTimeSave(inputEl) {
  const variantId = inputEl.dataset.variantId;
  if (!variantId) return;
  clearTimeout(_ltTimers[variantId]);
  _ltTimers[variantId] = setTimeout(async () => {
    // Collect both fields for this variant
    const ltInput  = document.querySelector(`.lt-input[data-variant-id="${variantId}"][data-field="leadTimeDays"]`);
    const rqInput  = document.querySelector(`.lt-input[data-variant-id="${variantId}"][data-field="reorderQty"]`);
    const leadTimeDays = parseInt(ltInput?.value) || 21;
    const reorderQty   = parseInt(rqInput?.value) || 0;
    try {
      await fetch('/api/inventory/lead-times', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ [variantId]: { leadTimeDays, reorderQty } }),
      });
      // Recalculate row display
      const row = document.querySelector(`tr[data-status][data-daily-vel]${ltInput ? '' : ''}`);
      // Find the row containing these inputs
      const tr = ltInput?.closest('tr');
      if (tr) {
        const inventory    = parseFloat(tr.dataset.inventory);
        const dailyVel     = parseFloat(tr.dataset.dailyVel);
        const projDailyVel = parseFloat(tr.dataset.projDailyVel);

        const daysRemaining     = (!isNaN(inventory) && dailyVel > 0) ? inventory / dailyVel : null;
        const projDaysRemaining = (!isNaN(inventory) && projDailyVel > 0) ? inventory / projDailyVel : null;

        // Determine new status
        let status;
        if (!isNaN(inventory)) {
          if (inventory === 0)                                               status = 'stockout';
          else if (inventory < 10)                                           status = 'critical';
          else if (daysRemaining !== null && daysRemaining <= leadTimeDays) status = 'reorder';
          else if (daysRemaining !== null && daysRemaining <= 30)           status = 'warn';
          else                                                                status = 'ok';
        } else {
          status = tr.dataset.status;
        }

        // Update data-lead-time
        tr.dataset.leadTime = leadTimeDays;
        tr.dataset.status   = status;

        // Update days-left cell (column index 5)
        const cells = tr.querySelectorAll('td');
        if (cells[5] && daysRemaining !== null) {
          const daysCls = daysRemaining <= leadTimeDays ? 'inv-days-crit' : daysRemaining <= 30 ? 'inv-days-warn' : 'inv-days-ok';
          cells[5].innerHTML = `<span class="inv-days-num ${daysCls}">${daysRemaining.toFixed(1)}d</span>`;
        }
        // Update proj-days cell (column index 6)
        if (cells[6] && projDaysRemaining !== null) {
          cells[6].innerHTML = `<span class="inv-days-num">${projDaysRemaining.toFixed(1)}d</span>`;
        }
        // Update status badge cell (column index 9)
        if (cells[9]) {
          const badgeClass = { ok: 's-ok', warn: 's-warn', reorder: 's-reorder', critical: 's-critical', stockout: 's-stockout' }[status] || 's-ok';
          const badgeLabel = { ok: 'OK', warn: 'Low', reorder: 'Reorder', critical: 'Critical', stockout: 'Stockout' }[status] || status;
          cells[9].innerHTML = `<span class="inv-status-badge ${badgeClass}">${badgeLabel}</span>`;
        }
        // Update row class
        tr.className = status === 'stockout' ? 'row-stockout' : status === 'critical' ? 'row-critical' : status === 'reorder' ? 'row-reorder' : '';
      }
    } catch (err) {
      console.error('Lead time save failed:', err.message);
    }
  }, 600);
}

function filterInventoryTable(status, btn) {
  // Update active button
  document.querySelectorAll('.inv-filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  document.querySelectorAll('#inv-product-list tr[data-status]').forEach(tr => {
    if (status === 'all') {
      tr.style.display = '';
    } else {
      tr.style.display = tr.dataset.status === status ? '' : 'none';
    }
  });

  // Hide product groups with no visible rows
  document.querySelectorAll('.inv-product-group').forEach(group => {
    const hasVisible = Array.from(group.querySelectorAll('tr[data-status]')).some(tr => tr.style.display !== 'none');
    group.style.display = hasVisible ? '' : 'none';
  });
}

loadOverview();
</script>
